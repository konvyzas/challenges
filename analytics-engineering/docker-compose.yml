services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ae_interview
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ae_interview -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-env:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # we want /app inside the container == ./dbt_project on the host
    working_dir: /app
    tty: true
    command: ["tail", "-f", "/dev/null"]

    volumes:
      - ./dbt_project:/app          # <- mount the actual dbt project dir
      - ./profiles:/root/.dbt       # -> where your profiles.yml lives
      - ./scripts:/app/scripts      # optional for your helper scripts
      - ./input:/app/input          # optional for input data files, etc.

    environment:
      DBT_PROFILES_DIR: /root/.dbt
      POSTGRES_USER: ae_interview
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analytics_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

volumes:
  pg_data: